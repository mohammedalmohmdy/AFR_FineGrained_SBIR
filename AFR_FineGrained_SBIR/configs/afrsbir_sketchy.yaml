# AFR-SBIR training/evaluation config -- Sketchy (Extended), category-level

experiment:
  name: AFR-SBIR-Sketchy-Extended
  seed: 42
  device: auto

dataset:
  name: Sketchy-Extended       # category-level protocol (mAP, P@100)
  root: /path/to/sketchy_ext   # <root>/sketch/{train,test}  <root>/photo/{train,test}
  image_size: 224
  # For true instance-level pairing use explicit index files (3-col train list):
  # list_files:
  #   train: index/train.txt    #  <sketch> <photo> <photo_id>
  #   query: index/query.txt    #  <image> <category>
  #   gallery: index/gallery.txt

model:
  backbone: resnet50
  embedding_dim: 256
  num_freq_hypotheses: 3
  frequency_hidden: 512
  confidence_hidden: 256
  use_frequency: true
  weight_mode: adaptive
  use_confidence: true
  feature_norm: true
  pretrained: true

training:
  batch_size: 32
  epochs: 100
  lr: 0.0001
  margin: 0.5
  lambda_conf: 0.1
  optimizer: adam
  weight_decay: 0.0
  scheduler: none
  save_every: 10
  eval_every: 10
  resume: null

evaluation:
  top_ks: [1, 5, 10, 20]
  p_at: 100

dataloader:
  num_workers: 0