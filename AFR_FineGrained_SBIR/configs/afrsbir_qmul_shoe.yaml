# AFR-SBIR training/evaluation config -- QMUL-Shoe-V2 (fine-grained instance-level)

experiment:
  name: AFR-SBIR-QMUL-Shoe-V2
  seed: 42
  device: auto

dataset:
  name: QMUL-Shoe-V2          # instance-level protocol
  root: /path/to/qmul_shoe    # <root>/photo/{train,test}  <root>/sketch/{train,test}
  image_size: 224
  # list_files:               # optional explicit indices (paths relative to root)
  #   train: index/train.txt  #  <sketch> <photo> <photo_id>
  #   query: index/query.txt  #  <image> <label>
  #   gallery: index/gallery.txt

model:
  backbone: resnet50
  embedding_dim: 256
  num_freq_hypotheses: 3
  frequency_hidden: 512       # Section 3.5
  confidence_hidden: 256      # Section 3.7
  use_frequency: true
  weight_mode: adaptive       # "adaptive" | "fixed" | "attention"
  use_confidence: true
  feature_norm: true
  pretrained: true

training:
  batch_size: 32
  epochs: 100
  lr: 0.0001
  margin: 0.5
  lambda_conf: 0.1
  optimizer: adam
  weight_decay: 0.0
  scheduler: none             # paper specifies constant LR (Adam, 1e-4)
  save_every: 10
  eval_every: 10
  resume: null

evaluation:
  top_ks: [1, 5, 10, 20]
  p_at: 100

dataloader:
  num_workers: 0